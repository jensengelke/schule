<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trigonometry Visualization</title>
    <style>
        body {
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background-color: #f0f0f0;
        }
        
        .canvas-container {
            display: flex;
            gap: 20px;
            margin-bottom: 20px;
        }
        
        #canvas {
            background-color: white;
            border: 1px solid #ccc;
        }
        
        #graphCanvas {
            background-color: white;
            border: 1px solid #ccc;
        }
        
        #tanCanvas {
            background-color: white;
            border: 1px solid #ccc;
        }
        
        .controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }
        
        button {
            padding: 10px 20px;
            font-size: 18px;
            cursor: pointer;
            background-color: #4CAF50;
            color: white;
            border: none;
            border-radius: 5px;
            transition: background-color 0.3s;
        }
        
        button:hover {
            background-color: #45a049;
        }
        
        button:active {
            background-color: #3d8b40;
        }
        
        .info {
            margin-top: 20px;
            padding: 15px;
            background-color: white;
            border-radius: 5px;
            border: 1px solid #ccc;
        }
        
        .info h3 {
            margin-top: 0;
        }
    </style>
</head>
<body>
    <h1>Trigonometry Visualization</h1>
    <div class="canvas-container">
        <canvas id="canvas" width="600" height="900"></canvas>
        <canvas id="graphCanvas" width="500" height="900"></canvas>
        <canvas id="tanCanvas" width="500" height="900"></canvas>
    </div>
    
    <div class="controls">
        <button id="counterClockwise" title="Rotate Counter-Clockwise">↺</button>
        <button id="clockwise" title="Rotate Clockwise">↻</button>
        <span id="angleDisplay" style="margin-left: 20px; font-size: 16px; font-weight: bold;"></span>
    </div>
    
    
    <script src="trigonometrie.js"></script>
</body>
</html>
